<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colorear · Acas</title>
<style>
:root {
  --bg:#1a1a2e; --panel:#16213e; --panel2:#0f3460;
  --accent:#e94560; --accent2:#f5a623; --text:#eaeaea;
  --muted:#7a7a9a; --btn:#1e2a4a; --font:'Segoe UI',sans-serif;
  --row:44px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* ── FILA 1: herramientas ── */
#row1{
  height:var(--row);min-height:var(--row);
  background:var(--panel);border-bottom:1px solid #2a2a4a;
  display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;flex-shrink:0;
}
#row1::-webkit-scrollbar{display:none;}
#row1-inner{display:flex;align-items:center;gap:4px;padding:0 6px;min-width:max-content;}

/* ── FILA 2: paleta de colores ── */
#row2{
  background:var(--panel2);border-bottom:1px solid #2a2a4a;
  overflow:hidden;flex-shrink:0;
  transition:max-height .3s ease;
  max-height:calc(var(--row)*2 + 2px);
}
#row2.expanded{ max-height:180px; }
#row2-scroll{
  display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
#row2-scroll::-webkit-scrollbar{display:none;}
#palette-inner{
  display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;
  min-width:max-content;
}
/* cuando expandido, permite wrapping */
#row2.expanded #row2-scroll{ overflow-x:hidden;overflow-y:auto;max-height:174px; }
#row2.expanded #palette-inner{ min-width:unset;flex-wrap:wrap; }

/* ── FILA 3: opciones contextuales (pincel, texto, gradiente…) ── */
#row3{
  height:var(--row);min-height:var(--row);
  background:#12192e;border-bottom:1px solid #2a2a4a;
  display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;flex-shrink:0;gap:6px;padding:0 8px;
}
#row3::-webkit-scrollbar{display:none;}
#row3 > *{flex-shrink:0;}

/* ── CANVAS ── */
#canvasWrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:auto;background:#0d0d1a;position:relative;
}
#mainCanvas{cursor:crosshair;display:block;box-shadow:0 0 40px #000a;}

/* ── STATUS ── */
#status{
  background:var(--panel);border-top:1px solid #2a2a4a;
  padding:2px 10px;font-size:10px;color:var(--muted);
  display:flex;gap:12px;align-items:center;flex-shrink:0;
}

/* ── BOTONES ── */
.tbtn{
  background:var(--btn);border:1px solid #2a3a6a;color:var(--text);
  border-radius:7px;padding:4px 7px;font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:36px;transition:background .15s;user-select:none;flex-shrink:0;
  touch-action:manipulation;
}
.tbtn:active,.tbtn.active{background:var(--accent);border-color:var(--accent);}
.tbtn span{font-size:15px;line-height:1;}
.sep{width:1px;height:28px;background:#2a3a6a;margin:0 2px;flex-shrink:0;}

/* ── SWATCHES ── */
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s;flex-shrink:0;}
.swatch:active,.swatch.sel{border-color:#fff;transform:scale(1.2);}

/* ── CONTROLES INLINE ── */
.lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
input[type=range]{width:80px;accent-color:var(--accent);vertical-align:middle;}
input[type=color].mini{width:28px;height:28px;padding:0;border:none;border-radius:5px;cursor:pointer;flex-shrink:0;}
select.mini{background:var(--btn);border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:3px 5px;font-size:10px;cursor:pointer;}
input.txt-in{background:var(--btn);border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:3px 6px;font-size:11px;width:100px;}
input.num-in{background:var(--btn);border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:3px 5px;font-size:11px;width:44px;}

/* ── MODAL ── */
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:center;justify-content:center;}
#modal.show{display:flex;}
#modalBox{background:var(--panel);border-radius:12px;padding:18px;min-width:250px;border:1px solid #2a3a6a;}
#modalBox h3{margin-bottom:10px;color:var(--accent2);}
#modalBox label{font-size:11px;color:var(--muted);display:block;margin:5px 0 2px;}
#modalBox input,#modalBox select{width:100%;background:var(--bg);border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:5px 7px;font-size:12px;}
.modal-btns{display:flex;gap:8px;margin-top:12px;}
.modal-btns button{flex:1;padding:7px;border-radius:7px;border:none;cursor:pointer;font-size:12px;}
.btn-ok{background:var(--accent);color:#fff;}
.btn-cancel{background:var(--btn);color:var(--text);}

/* boton expandir paleta */
#btnExpandPalette{
  position:sticky;right:0;background:var(--panel2);
  border:none;border-left:1px solid #2a2a4a;
  color:var(--accent2);font-size:16px;padding:0 8px;
  height:100%;cursor:pointer;flex-shrink:0;z-index:2;
}
</style>
</head>
<body>

<!-- FILA 1: Herramientas -->
<div id="row1">
  <div id="row1-inner">
    <button class="tbtn active" id="btnPen"     onclick="setTool('pen')">     <span>✏️</span>Pincel</button>
    <button class="tbtn"        id="btnEraser"  onclick="setTool('eraser')">  <span>🧹</span>Borrar</button>
    <button class="tbtn"        id="btnFill"    onclick="setTool('fill')">    <span>🪣</span>Relleno</button>
    <button class="tbtn"        id="btnGrad"    onclick="setTool('gradient')"><span>🌈</span>Degradado</button>
    <button class="tbtn"        id="btnLine"    onclick="setTool('line')">    <span>📏</span>Línea</button>
    <button class="tbtn"        id="btnHorizon" onclick="setTool('horizon')"> <span>🏔️</span>Montaña</button>
    <button class="tbtn"        id="btnText"    onclick="setTool('text')">    <span>🔤</span>Texto</button>
    <button class="tbtn"        id="btnEyedrop" onclick="setTool('eyedrop')"> <span>💉</span>Cuentag.</button>
    <div class="sep"></div>
    <!-- FORMAS -->
    <button class="tbtn" onclick="setShape('circle')"   ><span>⭕</span>Círculo</button>
    <button class="tbtn" onclick="setShape('rect')"     ><span>⬜</span>Rect.</button>
    <button class="tbtn" onclick="setShape('triangle')" ><span>🔺</span>Triang.</button>
    <button class="tbtn" onclick="setShape('star')"     ><span>⭐</span>Estrella</button>
    <button class="tbtn" onclick="setShape('heart')"    ><span>❤️</span>Corazón</button>
    <button class="tbtn" onclick="setShape('flower')"   ><span>🌸</span>Flor</button>
    <button class="tbtn" onclick="setShape('sun')"      ><span>☀️</span>Sol</button>
    <button class="tbtn" onclick="setShape('moon')"     ><span>🌙</span>Luna</button>
    <button class="tbtn" onclick="setShape('house')"    ><span>🏠</span>Casa</button>
    <button class="tbtn" onclick="setShape('tree')"     ><span>🌲</span>Árbol</button>
    <button class="tbtn" onclick="setShape('cloud')"    ><span>☁️</span>Nube</button>
    <button class="tbtn" onclick="setShape('arrow')"    ><span>➡️</span>Flecha</button>
    <button class="tbtn" onclick="setShape('butterfly')"><span>🦋</span>Mariposa</button>
    <button class="tbtn" onclick="setShape('bird')"     ><span>🐦</span>Pájaro</button>
    <button class="tbtn" onclick="setShape('fish')"     ><span>🐟</span>Pez</button>
    <div class="sep"></div>
    <button class="tbtn" onclick="undoAction()">   <span>↩️</span>Deshacer</button>
    <button class="tbtn" onclick="clearCanvas()">  <span>🗑️</span>Limpiar</button>
    <button class="tbtn" onclick="showSizeModal()"><span>📄</span>Tamaño</button>
    <button class="tbtn" onclick="saveImage()">    <span>💾</span>Guardar</button>
    <button class="tbtn" onclick="toggleBg()">     <span>⬜</span>Fondo</button>
  </div>
</div>

<!-- FILA 2: Paleta de colores -->
<div id="row2">
  <div style="display:flex;height:100%;">
    <div id="row2-scroll" style="flex:1;">
      <div id="palette-inner">
        <!-- swatches por JS -->
        <input type="color" class="mini" id="customColor" value="#e94560" title="Personalizado" oninput="setColor(this.value)">
        <input type="color" class="mini" id="addColorPick" title="Añadir a mi paleta">
        <button class="tbtn" style="padding:2px 6px;font-size:10px;" onclick="addToMyPalette()">+</button>
      </div>
    </div>
    <button id="btnExpandPalette" onclick="togglePalette()" title="Expandir/cerrar paleta">▼</button>
  </div>
</div>

<!-- FILA 3: Opciones de herramienta activa -->
<div id="row3">
  <!-- PINCEL -->
  <div id="opts-pen" class="tool-opts" style="display:flex;gap:6px;align-items:center;">
    <span class="lbl">Tamaño</span>
    <input type="range" id="brushSize" min="1" max="80" value="8" oninput="updateBrush()">
    <span class="lbl" id="bsizeVal">8</span>
    <select class="mini" id="brushType" onchange="updateBrush()">
      <option value="round">● Redondo</option>
      <option value="square">■ Cuadrado</option>
      <option value="spray">✦ Spray</option>
      <option value="star">★ Estrella</option>
      <option value="heart">♥ Corazón</option>
      <option value="leaf">🌿 Hoja</option>
      <option value="circle">○ Hueco</option>
      <option value="diamond">◆ Diamante</option>
    </select>
    <span class="lbl">Opac.</span>
    <input type="range" id="brushOpacity" min="5" max="100" value="100" oninput="updateBrush()">
    <canvas id="prevCanvas" width="40" height="34" style="border-radius:4px;background:#0d0d1a;"></canvas>
  </div>
  <!-- DEGRADADO -->
  <div id="opts-gradient" class="tool-opts" style="display:none;gap:6px;align-items:center;">
    <span class="lbl">Color 1</span><input type="color" class="mini" id="grad1" value="#e94560">
    <span class="lbl">2</span><input type="color" class="mini" id="grad2" value="#f5a623">
    <span class="lbl">3</span><input type="color" class="mini" id="grad3" value="#00b4d8">
    <select class="mini" id="gradDir">
      <option value="lr">← → Horiz.</option>
      <option value="tb">↓ Vert.</option>
      <option value="diag">↘ Diag.</option>
      <option value="radial">◎ Radial</option>
    </select>
  </div>
  <!-- TEXTO -->
  <div id="opts-text" class="tool-opts" style="display:none;gap:6px;align-items:center;flex-wrap:nowrap;">
    <input type="text" class="txt-in" id="textInput" placeholder="Texto..." value="Hola">
    <input type="number" class="num-in" id="fontSize" value="32" min="8" max="200">
    <select class="mini" id="fontFamily">
      <option>Arial</option><option>Georgia</option><option>Courier New</option>
      <option>Impact</option><option>Comic Sans MS</option><option>Times New Roman</option>
    </select>
    <button class="tbtn" style="padding:2px 6px;font-size:10px;" onclick="setTextDir('h')">→H</button>
    <button class="tbtn" style="padding:2px 6px;font-size:10px;" onclick="setTextDir('v')">↓V</button>
    <button class="tbtn" style="padding:2px 6px;font-size:10px;" onclick="setTextDir('d')">↘D</button>
    <input type="color" class="mini" id="textFill" value="#000000" title="Color texto">
    <label style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px;">
      <input type="checkbox" id="textGrad"> Degradado
    </label>
  </div>
  <!-- FONDO -->
  <div id="opts-bg" class="tool-opts" style="display:none;gap:6px;align-items:center;">
    <span class="lbl">Color fondo</span>
    <input type="color" class="mini" id="bgColor" value="#ffffff" oninput="applyBg()">
    <button class="tbtn" onclick="setBgTransparent()"><span>🔲</span>Transp.</button>
  </div>
  <!-- DEFAULT -->
  <div id="opts-default" class="tool-opts" style="display:flex;gap:6px;align-items:center;">
    <span class="lbl">Tamaño</span>
    <input type="range" id="brushSize2" min="1" max="80" value="8" oninput="syncBrush(this)">
  </div>
</div>

<!-- CANVAS -->
<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
</div>

<!-- STATUS -->
<div id="status">
  <span id="statusTool">Pincel</span>
  <span id="statusPos">X:0 Y:0</span>
  <span id="statusSize">794×1123</span>
  <span style="display:flex;align-items:center;gap:3px;">
    <span id="colorDot" style="display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #fff;background:#e94560;"></span>
    <span id="colorHex">#e94560</span>
  </span>
</div>

<!-- MODAL TAMAÑO -->
<div id="modal">
  <div id="modalBox">
    <h3>📄 Tamaño del Lienzo</h3>
    <label>Preset</label>
    <select id="paperPreset" onchange="applyPreset()">
      <option value="">— Elegir —</option>
      <option value="794,1123">A4 Vertical (794×1123)</option>
      <option value="1123,794">A4 Horizontal (1123×794)</option>
      <option value="559,794">A5 Vertical (559×794)</option>
      <option value="1587,2245">A3 Vertical (1587×2245)</option>
      <option value="1080,1080">Instagram Cuadrado</option>
      <option value="1080,1920">Story (1080×1920)</option>
      <option value="800,600">Pantalla 800×600</option>
    </select>
    <label>Ancho (px)</label><input type="number" id="cWidth" value="794" min="100" max="4000">
    <label>Alto (px)</label><input type="number" id="cHeight" value="1123" min="100" max="4000">
    <div class="modal-btns">
      <button class="btn-ok" onclick="applySize()">✅ Aplicar</button>
      <button class="btn-cancel" onclick="closeModal()">❌ Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────
const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');
let tool='pen', color='#e94560', brushSize=8, brushOpacity=1, brushType='round';
let drawing=false, startX=0, startY=0, lastX=0, lastY=0;
let undoStack=[], transparentBg=false, textDir='h', shapeMode=null;
let horizonPoints=[], horizonSnap=null, shapeSnap=null;

// ── INIT CANVAS ─────────────────────────────────────────
function initCanvas(w=794,h=1123){
  const old = canvas.width>0 ? ctx.getImageData(0,0,canvas.width,canvas.height) : null;
  canvas.width=w; canvas.height=h;
  if(!transparentBg){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); }
  if(old){ try{ ctx.putImageData(old,0,0); }catch(e){} }
  document.getElementById('statusSize').textContent=`${w}×${h}`;
  saveUndo();
}
initCanvas();

// ── PALETTE ─────────────────────────────────────────────
const PALETTE=[
  '#000000','#ffffff','#e94560','#f5a623','#ffe066','#4caf50','#00b4d8','#9b59b6',
  '#ff6b6b','#ffa07a','#98d8c8','#6c5ce7','#fd79a8','#00cec9','#2d3436','#636e72',
  '#b2bec3','#dfe6e9','#e17055','#74b9ff','#55efc4','#a29bfe','#fab1a0','#fdcb6e',
  '#d63031','#0984e3','#00b894','#6d4c41','#f8bbd9','#e8f5e9','#ff9ff3','#ffeaa7',
  '#81ecec','#a29bfe','#636e72','#2d3436','#badc58','#eb4d4b','#6ab04c','#e55039',
];
const pi = document.getElementById('palette-inner');
PALETTE.forEach(c=>{
  const s=document.createElement('div');
  s.className='swatch'; s.style.background=c; s.title=c;
  s.addEventListener('pointerdown',()=>setColor(c));
  pi.insertBefore(s, document.getElementById('customColor'));
});

function setColor(c){
  color=c;
  document.getElementById('customColor').value=c;
  document.getElementById('colorDot').style.background=c;
  document.getElementById('colorHex').textContent=c;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',rgbToHex(s.style.background)===c||s.style.background===c));
}
function rgbToHex(rgb){
  const m=rgb.match(/\d+/g); if(!m) return rgb;
  return '#'+m.map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
}
function addToMyPalette(){
  const c=document.getElementById('addColorPick').value;
  const s=document.createElement('div');
  s.className='swatch'; s.style.background=c;
  s.addEventListener('pointerdown',()=>setColor(c));
  pi.insertBefore(s, document.getElementById('addColorPick'));
}

// ── PALETTE EXPAND ───────────────────────────────────────
function togglePalette(){
  const r2=document.getElementById('row2');
  const btn=document.getElementById('btnExpandPalette');
  r2.classList.toggle('expanded');
  btn.textContent = r2.classList.contains('expanded') ? '▲' : '▼';
}

// ── TOOL OPTIONS PANELS ──────────────────────────────────
function showOpts(name){
  document.querySelectorAll('.tool-opts').forEach(d=>d.style.display='none');
  const el=document.getElementById('opts-'+name);
  if(el) el.style.display='flex';
  else document.getElementById('opts-pen').style.display='flex';
}

// ── SET TOOL ─────────────────────────────────────────────
function setTool(t){
  tool=t; shapeMode=null;
  document.querySelectorAll('#row1-inner .tbtn').forEach(b=>b.classList.remove('active'));
  const map={pen:'btnPen',eraser:'btnEraser',fill:'btnFill',gradient:'btnGrad',line:'btnLine',horizon:'btnHorizon',text:'btnText',eyedrop:'btnEyedrop'};
  if(map[t]) document.getElementById(map[t]).classList.add('active');
  document.getElementById('statusTool').textContent=t;
  horizonPoints=[]; horizonSnap=null;
  canvas.style.cursor=t==='eyedrop'?'cell':t==='fill'?'cell':'crosshair';
  const optsMap={gradient:'gradient',text:'text',eraser:'pen',line:'pen',horizon:'pen',shape:'pen',eyedrop:'default',fill:'default'};
  showOpts(optsMap[t]||t);
}
function setShape(s){ shapeMode=s; setTool('shape'); document.getElementById('statusTool').textContent='Forma:'+s; }
function setTextDir(d){ textDir=d; }

// ── UPDATE BRUSH ─────────────────────────────────────────
function updateBrush(){
  brushSize=+document.getElementById('brushSize').value;
  brushOpacity=+document.getElementById('brushOpacity').value/100;
  brushType=document.getElementById('brushType').value;
  document.getElementById('bsizeVal').textContent=brushSize;
  document.getElementById('brushSize2').value=brushSize;
  // preview
  const pc=document.getElementById('prevCanvas');
  const px=pc.getContext('2d');
  px.clearRect(0,0,40,34);
  px.globalAlpha=brushOpacity; px.fillStyle=color; px.strokeStyle=color;
  paintOnCtx(px,20,17,Math.min(brushSize,16));
}
function syncBrush(el){
  document.getElementById('brushSize').value=el.value;
  updateBrush();
}

// ── CANVAS EVENTS ─────────────────────────────────────────
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width, sy=canvas.height/r.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=getPos(e);onDown(p.x,p.y);});
canvas.addEventListener('pointermove',e=>{e.preventDefault();const p=getPos(e);onMove(p.x,p.y);document.getElementById('statusPos').textContent=`X:${Math.round(p.x)} Y:${Math.round(p.y)}`;});
canvas.addEventListener('pointerup',e=>{e.preventDefault();onUp();});
canvas.addEventListener('pointerleave',()=>{if(drawing)onUp();});

function onDown(x,y){
  startX=x;startY=y;lastX=x;lastY=y;
  if(tool==='fill'){saveUndo();floodFill(Math.round(x),Math.round(y),color);return;}
  if(tool==='eyedrop'){pickColor(Math.round(x),Math.round(y));return;}
  if(tool==='text'){saveUndo();drawText(x,y);return;}
  if(tool==='horizon'){horizonPoints.push({x,y});drawHorizonPreview();return;}
  saveUndo(); drawing=true;
  if(tool==='pen'||tool==='eraser') startStroke(x,y);
  if(tool==='line'||tool==='shape'||tool==='gradient') shapeSnap=ctx.getImageData(0,0,canvas.width,canvas.height);
}
function onMove(x,y){
  if(!drawing)return;
  if(tool==='pen'||tool==='eraser') continueStroke(x,y);
  if(tool==='line'||tool==='shape'||tool==='gradient') previewShape(x,y);
  lastX=x;lastY=y;
}
function onUp(){
  if(!drawing)return; drawing=false;
  if(tool==='line') finalizeLine(lastX,lastY);
  if(tool==='shape') finalizeShape(lastX,lastY);
  if(tool==='gradient') applyGradient(startX,startY,lastX,lastY);
}

// ── STROKE ───────────────────────────────────────────────
function startStroke(x,y){
  ctx.globalAlpha=brushOpacity;
  ctx.strokeStyle=tool==='eraser'?'#fff':color;
  ctx.fillStyle=tool==='eraser'?'#fff':color;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=brushSize;
  if(brushType==='round'){ctx.beginPath();ctx.moveTo(x,y);}
  paintAt(x,y);
}
function continueStroke(x,y){
  if(brushType==='round'){ctx.lineTo(x,y);ctx.stroke();}
  else paintAt(x,y);
}
function paintAt(x,y){
  ctx.globalAlpha=brushOpacity;
  ctx.fillStyle=tool==='eraser'?'#fff':color;
  ctx.strokeStyle=tool==='eraser'?'#fff':color;
  paintOnCtx(ctx,x,y,brushSize);
}
function paintOnCtx(cx,x,y,s){
  switch(brushType||'round'){
    case 'round': cx.beginPath();cx.arc(x,y,s/2,0,Math.PI*2);cx.fill();break;
    case 'square': cx.fillRect(x-s/2,y-s/2,s,s);break;
    case 'circle': cx.beginPath();cx.arc(x,y,s/2,0,Math.PI*2);cx.lineWidth=Math.max(1,s*0.15);cx.stroke();break;
    case 'star': drawStar(cx,x,y,5,s/2,s/4);cx.fill();break;
    case 'heart': drawHeart(cx,x,y,s);cx.fill();break;
    case 'diamond': drawDiamond(cx,x,y,s);cx.fill();break;
    case 'leaf': drawLeaf(cx,x,y,s);cx.fill();break;
    case 'spray': drawSpray(cx,x,y,s);break;
  }
}

// ── SHAPE PREVIEW ────────────────────────────────────────
function previewShape(x,y){
  ctx.putImageData(shapeSnap,0,0);
  ctx.globalAlpha=brushOpacity; ctx.strokeStyle=color; ctx.fillStyle=color+'88'; ctx.lineWidth=brushSize;
  if(tool==='line'){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();}
  else if(tool==='shape') drawShapeAt(ctx,shapeMode,startX,startY,x,y);
  else if(tool==='gradient'){
    ctx.fillStyle=makeGradient(startX,startY,x,y);
    ctx.fillRect(Math.min(startX,x),Math.min(startY,y),Math.abs(x-startX),Math.abs(y-startY));
  }
}
function finalizeLine(x,y){ctx.putImageData(shapeSnap,0,0);ctx.globalAlpha=brushOpacity;ctx.strokeStyle=color;ctx.lineWidth=brushSize;ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();shapeSnap=null;}
function finalizeShape(x,y){ctx.putImageData(shapeSnap,0,0);ctx.globalAlpha=brushOpacity;ctx.strokeStyle=color;ctx.fillStyle=color+'88';ctx.lineWidth=brushSize;drawShapeAt(ctx,shapeMode,startX,startY,x,y);shapeSnap=null;}
function applyGradient(x1,y1,x2,y2){if(shapeSnap)ctx.putImageData(shapeSnap,0,0);ctx.globalAlpha=brushOpacity;ctx.fillStyle=makeGradient(x1,y1,x2,y2);ctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));shapeSnap=null;}
function makeGradient(x1,y1,x2,y2){
  const c1=document.getElementById('grad1').value,c2=document.getElementById('grad2').value,c3=document.getElementById('grad3').value;
  const dir=document.getElementById('gradDir').value;
  let g;
  if(dir==='radial'){const cx=(x1+x2)/2,cy=(y1+y2)/2,r=Math.hypot(x2-x1,y2-y1)/2;g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);}
  else if(dir==='lr') g=ctx.createLinearGradient(Math.min(x1,x2),0,Math.max(x1,x2),0);
  else if(dir==='tb') g=ctx.createLinearGradient(0,Math.min(y1,y2),0,Math.max(y1,y2));
  else g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,c1);g.addColorStop(0.5,c2);g.addColorStop(1,c3);
  return g;
}

// ── SHAPE LIBRARY ────────────────────────────────────────
function drawShapeAt(cx,shape,x1,y1,x2,y2){
  const w=x2-x1,h=y2-y1,cx2=(x1+x2)/2,cy=(y1+y2)/2,r=Math.min(Math.abs(w),Math.abs(h))/2;
  cx.beginPath();
  switch(shape){
    case 'circle': cx.arc(cx2,cy,r,0,Math.PI*2);cx.fill();cx.stroke();break;
    case 'rect':   cx.rect(x1,y1,w,h);cx.fill();cx.stroke();break;
    case 'triangle': cx.moveTo(cx2,y1);cx.lineTo(x2,y2);cx.lineTo(x1,y2);cx.closePath();cx.fill();cx.stroke();break;
    case 'star':   drawStar(cx,cx2,cy,5,r,r*0.4);cx.fill();cx.stroke();break;
    case 'heart':  drawHeart(cx,cx2,cy,r*2);cx.fill();cx.stroke();break;
    case 'flower': drawFlower(cx,cx2,cy,r);break;
    case 'sun':    drawSun(cx,cx2,cy,r);break;
    case 'moon':   drawMoon(cx,cx2,cy,r);break;
    case 'house':  drawHouse(cx,x1,y1,w,h);break;
    case 'tree':   drawTree(cx,cx2,y1,r,h);break;
    case 'cloud':  drawCloud(cx,cx2,cy,r);break;
    case 'arrow':  drawArrow(cx,x1,cy,x2,r);break;
    case 'butterfly': drawButterfly(cx,cx2,cy,r);break;
    case 'bird':   drawBird(cx,cx2,cy,r);break;
    case 'fish':   drawFish(cx,cx2,cy,r);break;
  }
}
function drawStar(cx,cx2,cy,pts,ro,ri){cx.beginPath();for(let i=0;i<pts*2;i++){const r2=i%2===0?ro:ri,a=Math.PI*i/pts-Math.PI/2;i===0?cx.moveTo(cx2+r2*Math.cos(a),cy+r2*Math.sin(a)):cx.lineTo(cx2+r2*Math.cos(a),cy+r2*Math.sin(a));}cx.closePath();}
function drawHeart(cx,cx2,cy,size){const s=size/2;cx.beginPath();cx.moveTo(cx2,cy+s*0.8);cx.bezierCurveTo(cx2-s*1.2,cy-s*0.2,cx2-s*1.5,cy-s*0.9,cx2,cy-s*0.5);cx.bezierCurveTo(cx2+s*1.5,cy-s*0.9,cx2+s*1.2,cy-s*0.2,cx2,cy+s*0.8);}
function drawDiamond(cx,cx2,cy,s){cx.beginPath();cx.moveTo(cx2,cy-s/2);cx.lineTo(cx2+s/2,cy);cx.lineTo(cx2,cy+s/2);cx.lineTo(cx2-s/2,cy);cx.closePath();}
function drawLeaf(cx,cx2,cy,s){cx.beginPath();cx.moveTo(cx2,cy-s/2);cx.quadraticCurveTo(cx2+s/2,cy,cx2,cy+s/2);cx.quadraticCurveTo(cx2-s/2,cy,cx2,cy-s/2);}
function drawSpray(cx,cx2,cy,r){const n=Math.round(r*2);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=Math.random()*r;cx.fillRect(cx2+d*Math.cos(a),cy+d*Math.sin(a),1.5,1.5);}}
function drawFlower(cx,cx2,cy,r){for(let i=0;i<6;i++){const a=Math.PI*i/3;cx.beginPath();cx.ellipse(cx2+r*0.6*Math.cos(a),cy+r*0.6*Math.sin(a),r*0.45,r*0.25,a,0,Math.PI*2);cx.fill();}cx.beginPath();cx.arc(cx2,cy,r*0.3,0,Math.PI*2);cx.fill();}
function drawSun(cx,cx2,cy,r){cx.beginPath();cx.arc(cx2,cy,r*0.5,0,Math.PI*2);cx.fill();for(let i=0;i<12;i++){const a=Math.PI*2*i/12;cx.beginPath();cx.moveTo(cx2+r*0.6*Math.cos(a),cy+r*0.6*Math.sin(a));cx.lineTo(cx2+r*Math.cos(a),cy+r*Math.sin(a));cx.stroke();}}
function drawMoon(cx,cx2,cy,r){cx.beginPath();cx.arc(cx2,cy,r,0.4,Math.PI*1.6);cx.fill();ctx.globalCompositeOperation='destination-out';cx.beginPath();cx.arc(cx2+r*0.4,cy,r*0.85,0,Math.PI*2);cx.fill();ctx.globalCompositeOperation='source-over';}
function drawHouse(cx,x1,y1,w,h){const mx=x1+w/2;cx.beginPath();cx.moveTo(mx,y1);cx.lineTo(x1+w,y1+h*0.4);cx.lineTo(x1,y1+h*0.4);cx.closePath();cx.fill();cx.beginPath();cx.rect(x1+w*0.1,y1+h*0.4,w*0.8,h*0.6);cx.fill();cx.stroke();}
function drawTree(cx,cx2,ty,r,h){cx.beginPath();cx.moveTo(cx2,ty);cx.lineTo(cx2+r,ty+h*0.7);cx.lineTo(cx2-r,ty+h*0.7);cx.closePath();cx.fill();cx.fillRect(cx2-r*0.2,ty+h*0.65,r*0.4,h*0.35);}
function drawCloud(cx,cx2,cy,r){cx.beginPath();cx.arc(cx2,cy,r*0.6,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(cx2-r*0.55,cy+r*0.15,r*0.45,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(cx2+r*0.55,cy+r*0.15,r*0.45,0,Math.PI*2);cx.fill();cx.beginPath();cx.rect(cx2-r,cy+r*0.15,r*2,r*0.45);cx.fill();}
function drawArrow(cx,x1,cy,x2,r){cx.beginPath();cx.moveTo(x1,cy-r*0.2);cx.lineTo(x2-r*0.3,cy-r*0.2);cx.lineTo(x2-r*0.3,cy-r*0.5);cx.lineTo(x2,cy);cx.lineTo(x2-r*0.3,cy+r*0.5);cx.lineTo(x2-r*0.3,cy+r*0.2);cx.lineTo(x1,cy+r*0.2);cx.closePath();cx.fill();}
function drawButterfly(cx,cx2,cy,r){for(const s of[-1,1]){cx.beginPath();cx.ellipse(cx2+s*r*0.55,cy-r*0.3,r*0.6,r*0.4,s*0.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(cx2+s*r*0.45,cy+r*0.35,r*0.45,r*0.3,-s*0.5,0,Math.PI*2);cx.fill();}cx.beginPath();cx.moveTo(cx2,cy-r*0.7);cx.lineTo(cx2,cy+r*0.7);cx.lineWidth=2;cx.stroke();}
function drawBird(cx,cx2,cy,r){cx.beginPath();cx.moveTo(cx2-r,cy);cx.quadraticCurveTo(cx2-r*0.5,cy-r*0.5,cx2,cy);cx.quadraticCurveTo(cx2+r*0.5,cy-r*0.5,cx2+r,cy);cx.stroke();cx.beginPath();cx.arc(cx2,cy+r*0.1,r*0.4,0,Math.PI*2);cx.fill();}
function drawFish(cx,cx2,cy,r){cx.beginPath();cx.ellipse(cx2,cy,r*0.7,r*0.4,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.moveTo(cx2+r*0.6,cy);cx.lineTo(cx2+r,cy-r*0.4);cx.lineTo(cx2+r,cy+r*0.4);cx.closePath();cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(cx2-r*0.2,cy-r*0.1,r*0.08,0,Math.PI*2);cx.fill();}

// ── HORIZON TOOL ─────────────────────────────────────────
function drawHorizonPreview(){
  if(!horizonSnap) horizonSnap=ctx.getImageData(0,0,canvas.width,canvas.height);
  ctx.putImageData(horizonSnap,0,0);
  ctx.globalAlpha=brushOpacity;ctx.strokeStyle=color;ctx.lineWidth=brushSize;
  ctx.beginPath();horizonPoints.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
}
document.addEventListener('dblclick',()=>{
  if(tool==='horizon'&&horizonPoints.length>1){
    ctx.putImageData(horizonSnap,0,0);
    ctx.globalAlpha=brushOpacity;ctx.strokeStyle=color;ctx.lineWidth=brushSize;
    ctx.beginPath();horizonPoints.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
    horizonPoints=[];horizonSnap=null;saveUndo();
  }
});

// ── FLOOD FILL ───────────────────────────────────────────
function floodFill(px,py,fc){
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=img.data,w=canvas.width,h=canvas.height;
  const idx=(x,y)=>(y*w+x)*4;
  const ti=idx(px,py);
  const tr=d[ti],tg=d[ti+1],tb=d[ti+2],ta=d[ti+3];
  const[fr,fg,fb]=hexToRgb(fc);
  if(tr===fr&&tg===fg&&tb===fb)return;
  const stack=[[px,py]],vis=new Uint8Array(w*h);
  while(stack.length){
    const[x,y]=stack.pop();
    if(x<0||x>=w||y<0||y>=h)continue;
    const i=idx(x,y),vi=y*w+x;
    if(vis[vi]||!matchColor(d,i,tr,tg,tb,ta))continue;
    vis[vi]=1;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(img,0,0);
}
function matchColor(d,i,r,g,b,a,t=30){return Math.abs(d[i]-r)<t&&Math.abs(d[i+1]-g)<t&&Math.abs(d[i+2]-b)<t&&Math.abs(d[i+3]-a)<t;}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// ── EYEDROP ──────────────────────────────────────────────
function pickColor(x,y){const p=ctx.getImageData(x,y,1,1).data;setColor('#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));}

// ── TEXT ─────────────────────────────────────────────────
function drawText(x,y){
  const txt=document.getElementById('textInput').value||'Texto';
  const sz=+document.getElementById('fontSize').value||32;
  const ff=document.getElementById('fontFamily').value;
  const useGrad=document.getElementById('textGrad').checked;
  ctx.font=`bold ${sz}px "${ff}"`;ctx.textBaseline='top';ctx.globalAlpha=brushOpacity;
  ctx.save();ctx.translate(x,y);
  if(textDir==='v') ctx.rotate(Math.PI/2);
  else if(textDir==='d') ctx.rotate(Math.PI/4);
  if(useGrad){
    const g=ctx.createLinearGradient(0,0,txt.length*sz*0.6,sz);
    g.addColorStop(0,document.getElementById('grad1').value);
    g.addColorStop(0.5,document.getElementById('grad2').value);
    g.addColorStop(1,document.getElementById('grad3').value);
    ctx.fillStyle=g;
  } else ctx.fillStyle=document.getElementById('textFill').value;
  ctx.fillText(txt,0,0);ctx.restore();
}

// ── BG ───────────────────────────────────────────────────
function applyBg(){
  transparentBg=false;
  const c=document.getElementById('bgColor').value;
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  ctx.fillStyle=c;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.putImageData(img,0,0);
}
function setBgTransparent(){transparentBg=true;const img=ctx.getImageData(0,0,canvas.width,canvas.height);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.putImageData(img,0,0);}
function toggleBg(){transparentBg=!transparentBg;if(!transparentBg)applyBg();else setBgTransparent();}

// ── UNDO ─────────────────────────────────────────────────
function saveUndo(){if(undoStack.length>40)undoStack.shift();undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));}
function undoAction(){if(undoStack.length<2)return;undoStack.pop();ctx.putImageData(undoStack[undoStack.length-1],0,0);}

// ── CLEAR ────────────────────────────────────────────────
function clearCanvas(keepT=false){
  saveUndo();ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!keepT&&!transparentBg){ctx.fillStyle=document.getElementById('bgColor').value||'#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);}
}

// ── SAVE ─────────────────────────────────────────────────
function saveImage(){const a=document.createElement('a');a.download='acas-'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();}

// ── SIZE MODAL ───────────────────────────────────────────
function showSizeModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function applyPreset(){const v=document.getElementById('paperPreset').value;if(!v)return;const[w,h]=v.split(',');document.getElementById('cWidth').value=w;document.getElementById('cHeight').value=h;}
function applySize(){initCanvas(+document.getElementById('cWidth').value||794,+document.getElementById('cHeight').value||1123);closeModal();}

// ── INIT ─────────────────────────────────────────────────
updateBrush();
setColor('#e94560');
showOpts('pen');
</script>
