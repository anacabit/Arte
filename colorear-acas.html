<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colorear · Acas</title>
<style>
:root{
  --bg:#1a1a2e;--panel:#16213e;--panel2:#0f3460;
  --accent:#e94560;--accent2:#f5a623;--text:#eaeaea;
  --muted:#8888aa;--btn:#1e2a4a;--row:46px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;}

/* ── FILAS ── */
.row{display:flex;align-items:center;flex-shrink:0;border-bottom:1px solid #252540;}

/* FILA 1 – herramientas scroll horizontal */
#row1{height:var(--row);background:var(--panel);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
#row1::-webkit-scrollbar{display:none;}
#r1in{display:flex;align-items:center;gap:4px;padding:0 6px;min-width:max-content;height:100%;}

/* FILA 2 – paleta colores */
#row2{background:#0d1829;flex-direction:column;padding:0;overflow:hidden;
  transition:max-height .3s ease;max-height:48px;}
#row2.expanded{max-height:200px;}
#row2-header{display:flex;align-items:center;width:100%;height:48px;flex-shrink:0;}
#row2-scroll{overflow-x:auto;overflow-y:hidden;flex:1;height:48px;scrollbar-width:none;}
#row2-scroll::-webkit-scrollbar{display:none;}
#pal{display:flex;align-items:center;gap:5px;padding:0 8px;height:48px;min-width:max-content;}
/* expandido: grid */
#row2.expanded #row2-scroll{overflow-x:hidden;overflow-y:auto;height:auto;max-height:152px;}
#row2.expanded #pal{flex-wrap:wrap;min-width:unset;height:auto;padding:8px;}

/* FILA 3 – opciones herramienta */
#row3{height:var(--row);background:#0a1020;overflow-x:auto;scrollbar-width:none;gap:6px;padding:0 8px;}
#row3::-webkit-scrollbar{display:none;}
#row3>*{flex-shrink:0;}
.tool-opts{display:none;gap:6px;align-items:center;}
.tool-opts.active{display:flex;}

/* CANVAS */
#cwrap{flex:1;overflow:auto;background:#111828;display:flex;align-items:center;justify-content:center;}
#cv{cursor:crosshair;display:block;box-shadow:0 0 30px #0008;}
/* checker transparencia */
#cwrap{background-image:repeating-conic-gradient(#1e2a3a 0% 25%,#0d1620 0% 50%);background-size:20px 20px;}

/* STATUS */
#status{height:22px;background:var(--panel);border-top:1px solid #252540;
  display:flex;align-items:center;gap:12px;padding:0 10px;font-size:10px;color:var(--muted);flex-shrink:0;}

/* BOTONES */
.tbtn{background:var(--btn);border:1px solid #2a3a6a;color:var(--text);
  border-radius:7px;padding:4px 7px;font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:38px;user-select:none;flex-shrink:0;touch-action:manipulation;white-space:nowrap;}
.tbtn:active,.tbtn.on{background:var(--accent);border-color:var(--accent);}
.tbtn .ic{font-size:15px;line-height:1;}
.sep{width:1px;height:30px;background:#2a3a6a;margin:0 2px;flex-shrink:0;}

/* SWATCHES – VISIBLES */
.sw{
  width:28px;height:28px;border-radius:50%;
  border:2px solid #fff4;cursor:pointer;flex-shrink:0;
  display:inline-block;
}
.sw.sel,.sw:active{outline:3px solid #fff;outline-offset:1px;}

/* color picker inline */
input[type=color].cpick{width:30px;height:30px;padding:0;border:2px solid #fff4;border-radius:50%;cursor:pointer;flex-shrink:0;background:none;}
input[type=range]{width:80px;accent-color:var(--accent);}
select.mini{background:var(--btn);border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:3px 5px;font-size:10px;}
.lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
input.ni{background:var(--btn);border:1px solid #2a3a6a;border-radius:5px;color:var(--text);padding:2px 5px;font-size:11px;width:44px;}

/* expand btn */
#btnExp{background:#1a2840;border:none;border-left:1px solid #252540;
  color:var(--accent2);font-size:18px;width:38px;height:48px;cursor:pointer;flex-shrink:0;}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:300;align-items:center;justify-content:center;}
.modal.show{display:flex;}
.mbox{background:var(--panel);border-radius:12px;padding:18px;min-width:260px;max-width:90vw;border:1px solid #2a3a6a;max-height:90vh;overflow-y:auto;}
.mbox h3{color:var(--accent2);margin-bottom:10px;font-size:14px;}
.mbox label{font-size:11px;color:var(--muted);display:block;margin:6px 0 2px;}
.mbox input,.mbox select,.mbox textarea{width:100%;background:#0d1829;border:1px solid #2a3a6a;border-radius:6px;color:var(--text);padding:5px 7px;font-size:12px;}
.mbtns{display:flex;gap:8px;margin-top:12px;}
.mbtns button{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:12px;}
.bok{background:var(--accent);color:#fff;}
.bcan{background:var(--btn);color:var(--text);}

/* TEXTO MODAL overlay */
#txtOverlay{display:none;position:fixed;inset:0;z-index:400;background:#0008;align-items:flex-end;justify-content:center;}
#txtOverlay.show{display:flex;}
#txtPanel{background:#0d1829;border-radius:12px 12px 0 0;padding:12px;width:100%;max-width:600px;}
#txtPanel textarea{width:100%;background:#0a1020;border:1px solid #2a3a6a;border-radius:8px;color:#fff;padding:8px;font-size:16px;min-height:80px;resize:none;}
#txtPanel .row3tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}

/* quita fondo slider */
#bgThresh{width:90px;accent-color:var(--accent2);}
</style>
</head>
<body>

<!-- FILA 1: HERRAMIENTAS -->
<div class="row" id="row1">
<div id="r1in">
  <button class="tbtn on" id="bPen"     onclick="setT('pen')">    <span class="ic">✏️</span>Pincel</button>
  <button class="tbtn"    id="bErase"   onclick="setT('eraser')"> <span class="ic">🧹</span>Borrar</button>
  <button class="tbtn"    id="bFill"    onclick="setT('fill')">   <span class="ic">🪣</span>Relleno</button>
  <button class="tbtn"    id="bGrad"    onclick="setT('gradient')"><span class="ic">🌈</span>Degradado</button>
  <button class="tbtn"    id="bLine"    onclick="setT('line')">   <span class="ic">📏</span>Línea</button>
  <button class="tbtn"    id="bMtn"     onclick="setT('horizon')"><span class="ic">🏔️</span>Montaña</button>
  <button class="tbtn"    id="bTxt"     onclick="openTxtModal()"> <span class="ic">🔤</span>Texto</button>
  <button class="tbtn"    id="bEye"     onclick="setT('eyedrop')"><span class="ic">💉</span>Cuentag.</button>
  <button class="tbtn"    id="bRemBg"   onclick="setT('rembg')">  <span class="ic">✂️</span>QuitaFondo</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="setShape('circle')"><span class="ic">⭕</span>Círculo</button>
  <button class="tbtn" onclick="setShape('rect')"  ><span class="ic">⬜</span>Rect.</button>
  <button class="tbtn" onclick="setShape('triangle')"><span class="ic">🔺</span>Triang.</button>
  <button class="tbtn" onclick="setShape('star')"  ><span class="ic">⭐</span>Estrella</button>
  <button class="tbtn" onclick="setShape('heart')" ><span class="ic">❤️</span>Corazón</button>
  <button class="tbtn" onclick="setShape('flower')" ><span class="ic">🌸</span>Flor</button>
  <button class="tbtn" onclick="setShape('sun')"   ><span class="ic">☀️</span>Sol</button>
  <button class="tbtn" onclick="setShape('moon')"  ><span class="ic">🌙</span>Luna</button>
  <button class="tbtn" onclick="setShape('house')" ><span class="ic">🏠</span>Casa</button>
  <button class="tbtn" onclick="setShape('tree')"  ><span class="ic">🌲</span>Árbol</button>
  <button class="tbtn" onclick="setShape('cloud')" ><span class="ic">☁️</span>Nube</button>
  <button class="tbtn" onclick="setShape('arrow')" ><span class="ic">➡️</span>Flecha</button>
  <button class="tbtn" onclick="setShape('butterfly')"><span class="ic">🦋</span>Mariposa</button>
  <button class="tbtn" onclick="setShape('bird')"  ><span class="ic">🐦</span>Pájaro</button>
  <button class="tbtn" onclick="setShape('fish')"  ><span class="ic">🐟</span>Pez</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="undo()">         <span class="ic">↩️</span>Deshacer</button>
  <button class="tbtn" onclick="clearAll()">      <span class="ic">🗑️</span>Limpiar</button>
  <button class="tbtn" onclick="showModal('mSize')"><span class="ic">📄</span>Tamaño</button>
  <!-- subir imagen -->
  <button class="tbtn" onclick="document.getElementById('fileIn').click()"><span class="ic">📂</span>Subir img</button>
  <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="loadImg(this)">
  <!-- guardar -->
  <button class="tbtn" onclick="showModal('mSave')"><span class="ic">💾</span>Guardar</button>
  <!-- fondo -->
  <button class="tbtn" onclick="showModal('mBg')"><span class="ic">⬜</span>Fondo</button>
</div>
</div>

<!-- FILA 2: PALETA COLORES -->
<div class="row" id="row2">
  <div id="row2-header">
    <div id="row2-scroll">
      <div id="pal">
        <!-- swatches por JS -->
        <input type="color" class="cpick" id="cpick" value="#e94560" title="Color personalizado" oninput="setColor(this.value)">
        <input type="color" class="cpick" id="addpick" value="#ff9900" title="Añadir color">
        <button class="tbtn" style="min-width:28px;padding:2px 5px;" onclick="addMyColor()" title="Añadir a mi paleta">+</button>
      </div>
    </div>
    <button id="btnExp" onclick="togglePal()">▼</button>
  </div>
</div>

<!-- FILA 3: OPCIONES HERRAMIENTA -->
<div class="row" id="row3">
  <!-- PEN / ERASER -->
  <div class="tool-opts active" id="o-pen">
    <span class="lbl">Tamaño</span>
    <input type="range" id="bsz" min="1" max="100" value="8" oninput="updBrush()">
    <span class="lbl" id="bszv">8</span>
    <select class="mini" id="btype" onchange="updBrush()">
      <option value="round">● Redondo</option>
      <option value="square">■ Cuadrado</option>
      <option value="spray">✦ Spray</option>
      <option value="star">★ Estrella</option>
      <option value="heart">♥ Corazón</option>
      <option value="leaf">🌿 Hoja</option>
      <option value="circle">○ Hueco</option>
      <option value="diamond">◆ Diamante</option>
    </select>
    <span class="lbl">Opac.</span>
    <input type="range" id="bop" min="5" max="100" value="100" oninput="updBrush()">
    <canvas id="prev" width="36" height="36" style="border-radius:4px;background:#0a1020;"></canvas>
  </div>
  <!-- GRADIENT -->
  <div class="tool-opts" id="o-gradient">
    <input type="color" class="cpick" id="g1" value="#e94560">
    <input type="color" class="cpick" id="g2" value="#f5a623">
    <input type="color" class="cpick" id="g3" value="#00b4d8">
    <select class="mini" id="gdir">
      <option value="lr">← →</option><option value="tb">↓</option>
      <option value="diag">↘</option><option value="radial">◎</option>
    </select>
  </div>
  <!-- REMBG -->
  <div class="tool-opts" id="o-rembg">
    <span class="lbl">Tolerancia</span>
    <input type="range" id="bgThresh" min="5" max="120" value="30">
    <button class="tbtn" onclick="removeBg()"><span class="ic">✂️</span>Quitar fondo</button>
    <span class="lbl" style="color:#888;font-size:9px;">Toca el color a quitar</span>
  </div>
  <!-- DEFAULT -->
  <div class="tool-opts" id="o-default">
    <span class="lbl">Tamaño línea</span>
    <input type="range" id="bsz2" min="1" max="100" value="8" oninput="syncSz(this)">
  </div>
</div>

<!-- CANVAS -->
<div id="cwrap"><canvas id="cv"></canvas></div>

<!-- STATUS -->
<div id="status">
  <span id="sTool">Pincel</span>
  <span id="sPos">X:0 Y:0</span>
  <span id="sSz">794×1123</span>
  <span style="display:flex;align-items:center;gap:3px;">
    <span id="cdot" style="width:11px;height:11px;border-radius:50%;border:1px solid #fff;background:#e94560;display:inline-block;"></span>
    <span id="chex">#e94560</span>
  </span>
</div>

<!-- MODAL: TAMAÑO -->
<div class="modal" id="mSize">
  <div class="mbox">
    <h3>📄 Tamaño del lienzo</h3>
    <label>Preset</label>
    <select id="pPreset" onchange="applyPreset()">
      <option value="">— elegir —</option>
      <option value="794,1123">A4 Vertical (794×1123 px)</option>
      <option value="1123,794">A4 Horizontal (1123×794 px)</option>
      <option value="559,794">A5 Vertical</option>
      <option value="1587,2245">A3 Vertical</option>
      <option value="1080,1080">Instagram cuadrado</option>
      <option value="1080,1920">Story vertical</option>
      <option value="800,600">Pantalla 800×600</option>
    </select>
    <label>Ancho (px)</label><input type="number" id="cw" value="794" min="100" max="5000">
    <label>Alto (px)</label><input type="number" id="ch" value="1123" min="100" max="5000">
    <div class="mbtns">
      <button class="bok" onclick="applySize()">✅ Aplicar</button>
      <button class="bcan" onclick="closeModal('mSize')">❌ Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: GUARDAR -->
<div class="modal" id="mSave">
  <div class="mbox">
    <h3>💾 Guardar imagen</h3>
    <label>Formato</label>
    <select id="saveFmt">
      <option value="png">PNG (con transparencia)</option>
      <option value="jpg">JPG (fondo blanco)</option>
      <option value="pdf">PDF (página completa)</option>
    </select>
    <label>Calidad JPG (si aplica)</label>
    <input type="range" id="jpgQ" min="50" max="100" value="92">
    <div class="mbtns">
      <button class="bok" onclick="doSave()">💾 Guardar</button>
      <button class="bcan" onclick="closeModal('mSave')">❌ Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: FONDO -->
<div class="modal" id="mBg">
  <div class="mbox">
    <h3>⬜ Color de fondo</h3>
    <label>Color</label>
    <input type="color" id="bgCol" value="#ffffff" style="height:40px;">
    <div class="mbtns">
      <button class="bok" onclick="applyBgColor()">✅ Aplicar color</button>
      <button class="tbtn" style="flex:1;" onclick="setBgTransp()">🔲 Transparente</button>
      <button class="bcan" onclick="closeModal('mBg')">❌ Cerrar</button>
    </div>
  </div>
</div>

<!-- OVERLAY TEXTO -->
<div id="txtOverlay">
  <div id="txtPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-weight:700;color:var(--accent2);">🔤 Escribir texto</span>
      <button class="tbtn" style="min-width:0;" onclick="closeTxtModal()">✕</button>
    </div>
    <textarea id="txtArea" placeholder="Escribe aquí... el teclado aparecerá" autocomplete="off" spellcheck="false"></textarea>
    <div class="row3tools">
      <span class="lbl">Tamaño</span>
      <input type="number" class="ni" id="tSz" value="36" min="8" max="300">
      <select class="mini" id="tFont">
        <option>Arial</option><option>Georgia</option><option>Courier New</option>
        <option>Impact</option><option>Comic Sans MS</option><option>Times New Roman</option>
        <option>Verdana</option>
      </select>
      <input type="color" class="cpick" id="tCol" value="#000000" title="Color texto">
      <button class="tbtn on" id="tdH" onclick="setTD('h')">→ Horiz.</button>
      <button class="tbtn"    id="tdV" onclick="setTD('v')">↓ Vert.</button>
      <button class="tbtn"    id="tdD" onclick="setTD('d')">↘ Diag.</button>
      <label style="font-size:10px;display:flex;align-items:center;gap:3px;color:var(--muted);">
        <input type="checkbox" id="tGrad"> Degradado
      </label>
      <button class="tbtn" style="background:#0a1020;" onclick="previewTxt()">👁 Vista previa</button>
      <button class="bok tbtn" onclick="stampTxt()">✅ Poner texto</button>
    </div>
    <div style="font-size:9px;color:var(--muted);margin-top:4px;">Toca el lienzo para colocar el texto después de escribir.</div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let tool='pen', color='#e94560', bsz=8, bop=1, btype='round';
let drawing=false, sx=0,sy=0,lx=0,ly=0;
let undoStk=[], transBg=false;
let textDir='h', shapeMode=null;
let hPts=[], hSnap=null, shSnap=null;
let pendingText=false;

// ── INIT ───────────────────────────────────
function initCv(w=794,h=1123){
  const old=cv.width>0?ctx.getImageData(0,0,cv.width,cv.height):null;
  cv.width=w; cv.height=h;
  if(!transBg){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);}
  if(old){try{ctx.putImageData(old,0,0);}catch(e){}}
  document.getElementById('sSz').textContent=`${w}×${h}`;
  saveU();
}
initCv();

// ── PALETTE ────────────────────────────────
const COLS=[
  '#000000','#111111','#333333','#555555','#777777','#999999','#bbbbbb','#dddddd','#ffffff',
  '#e94560','#c0392b','#e74c3c','#ff6b6b','#ff9ff3','#fd79a8','#e84393',
  '#f5a623','#e67e22','#f39c12','#fdcb6e','#ffeaa7','#ffe066',
  '#ffe234','#f1c40f','#d4ac0d','#badc58','#a3cb38',
  '#4caf50','#27ae60','#2ecc71','#55efc4','#00b894','#00cec9',
  '#00b4d8','#0984e3','#2980b9','#74b9ff','#81ecec','#a29bfe',
  '#9b59b6','#8e44ad','#6c5ce7','#fd79a8','#e056fd','#be2edd',
  '#6d4c41','#795548','#a0522d','#8d6e63','#fab1a0',
];
const palEl=document.getElementById('pal');
COLS.forEach(c=>{
  const d=document.createElement('span');
  d.className='sw'; d.style.background=c; d.title=c;
  d.addEventListener('pointerdown',e=>{e.preventDefault();setColor(c);});
  palEl.insertBefore(d,document.getElementById('cpick'));
});

function setColor(c){
  color=c;
  document.getElementById('cpick').value=c;
  document.getElementById('cdot').style.background=c;
  document.getElementById('chex').textContent=c;
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('sel',s.style.background===c||rgbHex(s.style.background)===c));
  updBrush();
}
function rgbHex(rgb){const m=rgb.match(/\d+/g);if(!m)return rgb;return '#'+m.map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');}

function addMyColor(){
  const c=document.getElementById('addpick').value;
  const d=document.createElement('span');
  d.className='sw'; d.style.background=c; d.title=c;
  d.addEventListener('pointerdown',e=>{e.preventDefault();setColor(c);});
  palEl.insertBefore(d,document.getElementById('cpick'));
}
function togglePal(){
  const r2=document.getElementById('row2');
  r2.classList.toggle('expanded');
  document.getElementById('btnExp').textContent=r2.classList.contains('expanded')?'▲':'▼';
}

// ── TOOL PANEL ─────────────────────────────
const toolPanels={pen:'o-pen',eraser:'o-pen',line:'o-default',horizon:'o-default',
  shape:'o-default',eyedrop:'o-default',fill:'o-default',gradient:'o-gradient',rembg:'o-rembg'};
function showOpts(t){
  document.querySelectorAll('.tool-opts').forEach(d=>d.classList.remove('active'));
  const id=toolPanels[t]||'o-default';
  document.getElementById(id).classList.add('active');
}

// ── SET TOOL ───────────────────────────────
function setT(t){
  tool=t; shapeMode=null;
  document.querySelectorAll('#r1in .tbtn').forEach(b=>b.classList.remove('on'));
  const m={pen:'bPen',eraser:'bErase',fill:'bFill',gradient:'bGrad',
           line:'bLine',horizon:'bMtn',eyedrop:'bEye',rembg:'bRemBg'};
  if(m[t])document.getElementById(m[t]).classList.add('on');
  document.getElementById('sTool').textContent=t;
  hPts=[];hSnap=null;
  cv.style.cursor=t==='eyedrop'||t==='fill'||t==='rembg'?'cell':'crosshair';
  showOpts(t);
  pendingText=false;
}
function setShape(s){shapeMode=s;setT('shape');document.getElementById('sTool').textContent='Forma:'+s;}

// ── BRUSH ──────────────────────────────────
function updBrush(){
  bsz=+document.getElementById('bsz').value;
  bop=+document.getElementById('bop').value/100;
  btype=document.getElementById('btype').value;
  document.getElementById('bszv').textContent=bsz;
  document.getElementById('bsz2').value=bsz;
  // preview
  const pc=document.getElementById('prev');
  const px=pc.getContext('2d');
  px.clearRect(0,0,36,36);
  px.globalAlpha=bop; px.fillStyle=color; px.strokeStyle=color; px.lineWidth=2;
  paintOn(px,18,18,Math.min(bsz,14));
}
function syncSz(el){document.getElementById('bsz').value=el.value;updBrush();}

// ── CANVAS EVENTS ──────────────────────────
function gpos(e){
  const r=cv.getBoundingClientRect();
  const scx=cv.width/r.width,scy=cv.height/r.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)*scx,y:(src.clientY-r.top)*scy};
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=gpos(e);onDn(p.x,p.y);},{passive:false});
cv.addEventListener('pointermove',e=>{e.preventDefault();const p=gpos(e);onMv(p.x,p.y);document.getElementById('sPos').textContent=`X:${Math.round(p.x)} Y:${Math.round(p.y)}`;},{passive:false});
cv.addEventListener('pointerup',  e=>{e.preventDefault();onUp();},{passive:false});
cv.addEventListener('pointerleave',()=>{if(drawing)onUp();});

function onDn(x,y){
  sx=x;sy=y;lx=x;ly=y;
  if(tool==='fill')    {saveU();floodFill(Math.round(x),Math.round(y),color);return;}
  if(tool==='eyedrop') {pickCol(Math.round(x),Math.round(y));return;}
  if(tool==='rembg')   {const thresh=+document.getElementById('bgThresh').value;saveU();removeBgAt(Math.round(x),Math.round(y),thresh);return;}
  if(tool==='horizon') {hPts.push({x,y});drawHPrev();return;}
  if(pendingText)      {saveU();doStampTxt(x,y);pendingText=false;closeTxtModal();return;}
  saveU(); drawing=true;
  if(tool==='pen'||tool==='eraser') startStroke(x,y);
  if(tool==='line'||tool==='shape'||tool==='gradient') shSnap=ctx.getImageData(0,0,cv.width,cv.height);
}
function onMv(x,y){
  if(!drawing)return;
  if(tool==='pen'||tool==='eraser') contStroke(x,y);
  if(tool==='line'||tool==='shape'||tool==='gradient') prevShape(x,y);
  lx=x;ly=y;
}
function onUp(){
  if(!drawing)return;drawing=false;
  if(tool==='line')     finLine(lx,ly);
  if(tool==='shape')    finShape(lx,ly);
  if(tool==='gradient') finGrad(sx,sy,lx,ly);
  shSnap=null;
}

// ── STROKE ─────────────────────────────────
function startStroke(x,y){
  ctx.globalAlpha=bop;
  const col=tool==='eraser'?'#fff':color;
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=bsz;
  if(btype==='round'){ctx.beginPath();ctx.moveTo(x,y);}
  paintAt(x,y);
}
function contStroke(x,y){
  if(btype==='round'){ctx.lineTo(x,y);ctx.stroke();}
  else paintAt(x,y);
}
function paintAt(x,y){
  ctx.globalAlpha=bop;
  const col=tool==='eraser'?'#fff':color;
  ctx.fillStyle=col;ctx.strokeStyle=col;
  paintOn(ctx,x,y,bsz);
}
function paintOn(g,x,y,s){
  switch(btype){
    case 'round':   g.beginPath();g.arc(x,y,s/2,0,Math.PI*2);g.fill();break;
    case 'square':  g.fillRect(x-s/2,y-s/2,s,s);break;
    case 'circle':  g.beginPath();g.arc(x,y,s/2,0,Math.PI*2);g.lineWidth=Math.max(1,s*.15);g.stroke();break;
    case 'star':    sStar(g,x,y,5,s/2,s/4);g.fill();break;
    case 'heart':   sHeart(g,x,y,s);g.fill();break;
    case 'diamond': sDiamond(g,x,y,s);g.fill();break;
    case 'leaf':    sLeaf(g,x,y,s);g.fill();break;
    case 'spray':   sSpray(g,x,y,s);break;
  }
}

// ── SHAPE PREVIEW/FINALIZE ──────────────────
function prevShape(x,y){
  ctx.putImageData(shSnap,0,0);
  ctx.globalAlpha=bop;ctx.strokeStyle=color;ctx.fillStyle=color+'88';ctx.lineWidth=bsz;
  if(tool==='line'){ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();}
  else if(tool==='shape') drawSh(ctx,shapeMode,sx,sy,x,y);
  else if(tool==='gradient'){ctx.fillStyle=mkGrad(sx,sy,x,y);ctx.fillRect(Math.min(sx,x),Math.min(sy,y),Math.abs(x-sx),Math.abs(y-sy));}
}
function finLine(x,y){ctx.putImageData(shSnap,0,0);ctx.globalAlpha=bop;ctx.strokeStyle=color;ctx.lineWidth=bsz;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();}
function finShape(x,y){ctx.putImageData(shSnap,0,0);ctx.globalAlpha=bop;ctx.strokeStyle=color;ctx.fillStyle=color+'aa';ctx.lineWidth=bsz;drawSh(ctx,shapeMode,sx,sy,x,y);}
function finGrad(x1,y1,x2,y2){if(shSnap)ctx.putImageData(shSnap,0,0);ctx.globalAlpha=bop;ctx.fillStyle=mkGrad(x1,y1,x2,y2);ctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));}
function mkGrad(x1,y1,x2,y2){
  const c1=document.getElementById('g1').value,c2=document.getElementById('g2').value,c3=document.getElementById('g3').value;
  const dir=document.getElementById('gdir').value;
  let g;
  if(dir==='radial'){const mx=(x1+x2)/2,my=(y1+y2)/2,r=Math.hypot(x2-x1,y2-y1)/2;g=ctx.createRadialGradient(mx,my,0,mx,my,r);}
  else if(dir==='lr')g=ctx.createLinearGradient(Math.min(x1,x2),0,Math.max(x1,x2),0);
  else if(dir==='tb')g=ctx.createLinearGradient(0,Math.min(y1,y2),0,Math.max(y1,y2));
  else g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,c1);g.addColorStop(.5,c2);g.addColorStop(1,c3);
  return g;
}

// ── SHAPE LIBRARY ──────────────────────────
function drawSh(g,shape,x1,y1,x2,y2){
  const w=x2-x1,h=y2-y1,mx=(x1+x2)/2,my=(y1+y2)/2,r=Math.min(Math.abs(w),Math.abs(h))/2;
  g.save();g.fillStyle=color+'aa';g.strokeStyle=color;g.lineWidth=bsz;
  switch(shape){
    case 'circle':    g.beginPath();g.arc(mx,my,r,0,Math.PI*2);g.fill();g.stroke();break;
    case 'rect':      g.beginPath();g.rect(x1,y1,w,h);g.fill();g.stroke();break;
    case 'triangle':  g.beginPath();g.moveTo(mx,y1);g.lineTo(x2,y2);g.lineTo(x1,y2);g.closePath();g.fill();g.stroke();break;
    case 'star':      sStar(g,mx,my,5,r,r*.4);g.fill();g.stroke();break;
    case 'heart':     sHeart(g,mx,my,r*2);g.fill();g.stroke();break;
    case 'flower':    sFlower(g,mx,my,r);break;
    case 'sun':       sSun(g,mx,my,r);break;
    case 'moon':      sMoon(g,mx,my,r);break;
    case 'house':     sHouse(g,x1,y1,w,h);break;
    case 'tree':      sTree(g,mx,y1,r,h);break;
    case 'cloud':     sCloud(g,mx,my,r);break;
    case 'arrow':     sArrow(g,x1,my,x2,r);break;
    case 'butterfly': sButterfly(g,mx,my,r);break;
    case 'bird':      sBird(g,mx,my,r);break;
    case 'fish':      sFish(g,mx,my,r);break;
  }
  g.restore();
}

function sStar(g,mx,my,pts,ro,ri){g.beginPath();for(let i=0;i<pts*2;i++){const rd=i%2===0?ro:ri,a=Math.PI*i/pts-Math.PI/2;i===0?g.moveTo(mx+rd*Math.cos(a),my+rd*Math.sin(a)):g.lineTo(mx+rd*Math.cos(a),my+rd*Math.sin(a));}g.closePath();}
function sHeart(g,mx,my,sz){const s=sz/2;g.beginPath();g.moveTo(mx,my+s*.8);g.bezierCurveTo(mx-s*1.2,my-s*.2,mx-s*1.5,my-s*.9,mx,my-s*.5);g.bezierCurveTo(mx+s*1.5,my-s*.9,mx+s*1.2,my-s*.2,mx,my+s*.8);}
function sDiamond(g,mx,my,s){g.beginPath();g.moveTo(mx,my-s/2);g.lineTo(mx+s/2,my);g.lineTo(mx,my+s/2);g.lineTo(mx-s/2,my);g.closePath();}
function sLeaf(g,mx,my,s){g.beginPath();g.moveTo(mx,my-s/2);g.quadraticCurveTo(mx+s/2,my,mx,my+s/2);g.quadraticCurveTo(mx-s/2,my,mx,my-s/2);}
function sSpray(g,mx,my,r){const n=Math.round(r*2);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=Math.random()*r;g.fillRect(mx+d*Math.cos(a),my+d*Math.sin(a),1.5,1.5);}}
function sFlower(g,mx,my,r){for(let i=0;i<6;i++){const a=Math.PI*i/3;g.beginPath();g.ellipse(mx+r*.6*Math.cos(a),my+r*.6*Math.sin(a),r*.45,r*.25,a,0,Math.PI*2);g.fill();}g.beginPath();g.arc(mx,my,r*.3,0,Math.PI*2);g.fill();}
function sSun(g,mx,my,r){g.beginPath();g.arc(mx,my,r*.5,0,Math.PI*2);g.fill();for(let i=0;i<12;i++){const a=Math.PI*2*i/12;g.beginPath();g.moveTo(mx+r*.62*Math.cos(a),my+r*.62*Math.sin(a));g.lineTo(mx+r*Math.cos(a),my+r*Math.sin(a));g.stroke();}}
function sMoon(g,mx,my,r){g.save();g.beginPath();g.arc(mx,my,r,0,Math.PI*2);g.fill();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(mx+r*.45,my-r*.1,r*.82,0,Math.PI*2);g.fill();g.restore();}
function sHouse(g,x1,y1,w,h){const mx=x1+w/2;g.beginPath();g.moveTo(mx,y1);g.lineTo(x1+w,y1+h*.4);g.lineTo(x1,y1+h*.4);g.closePath();g.fill();g.stroke();g.beginPath();g.rect(x1+w*.1,y1+h*.4,w*.8,h*.6);g.fill();g.stroke();}
function sTree(g,mx,ty,r,h){g.beginPath();g.moveTo(mx,ty);g.lineTo(mx+r,ty+h*.65);g.lineTo(mx-r,ty+h*.65);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(mx,ty+h*.15);g.lineTo(mx+r*.8,ty+h*.72);g.lineTo(mx-r*.8,ty+h*.72);g.closePath();g.fill();g.fillRect(mx-r*.18,ty+h*.63,r*.36,h*.37);}
function sCloud(g,mx,my,r){[{x:0,y:0,s:.55},{x:-.5,y:.2,s:.42},{x:.5,y:.2,s:.42},{x:-.2,y:-.3,s:.38},{x:.25,y:-.25,s:.35}].forEach(c=>{g.beginPath();g.arc(mx+r*c.x,my+r*c.y,r*c.s,0,Math.PI*2);g.fill();});g.fillRect(mx-r,my+r*.2,r*2,r*.42);}
function sArrow(g,x1,cy,x2,r){g.beginPath();g.moveTo(x1,cy-r*.22);g.lineTo(x2-r*.35,cy-r*.22);g.lineTo(x2-r*.35,cy-.55*r);g.lineTo(x2,cy);g.lineTo(x2-r*.35,cy+r*.55);g.lineTo(x2-r*.35,cy+r*.22);g.lineTo(x1,cy+r*.22);g.closePath();g.fill();g.stroke();}
function sButterfly(g,mx,my,r){for(const s of[-1,1]){g.beginPath();g.ellipse(mx+s*r*.55,my-r*.3,r*.6,r*.38,s*.5,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.ellipse(mx+s*r*.45,my+r*.38,r*.45,r*.28,-s*.5,0,Math.PI*2);g.fill();g.stroke();}g.beginPath();g.moveTo(mx,my-r*.7);g.lineTo(mx,my+r*.7);g.lineWidth=2;g.stroke();}
function sBird(g,mx,my,r){g.save();g.fillStyle=color;g.strokeStyle=color;g.lineWidth=Math.max(1,bsz*.5);g.beginPath();g.ellipse(mx,my,r*.55,r*.32,0,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.arc(mx+r*.45,my-r*.18,r*.26,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.moveTo(mx-r*.55,my);g.quadraticCurveTo(mx-r*.2,my-r*.65,mx+r*.1,my-r*.15);g.quadraticCurveTo(mx-r*.1,my+r*.1,mx-r*.55,my);g.fill();g.stroke();g.fillStyle='#ffd700';g.beginPath();g.moveTo(mx+r*.68,my-r*.18);g.lineTo(mx+r*.95,my-r*.12);g.lineTo(mx+r*.68,my-r*.06);g.closePath();g.fill();g.restore();}
function sFish(g,mx,my,r){g.save();g.fillStyle=color;g.strokeStyle=color;g.beginPath();g.moveTo(mx+r*.55,my);g.lineTo(mx+r,my-r*.42);g.lineTo(mx+r,my+r*.42);g.closePath();g.fill();g.stroke();g.beginPath();g.ellipse(mx-r*.1,my,r*.68,r*.4,0,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(mx-r*.38,my-r*.1,r*.1,0,Math.PI*2);g.fill();g.fillStyle='#000';g.beginPath();g.arc(mx-r*.36,my-r*.1,r*.05,0,Math.PI*2);g.fill();g.restore();}

// ── HORIZON ────────────────────────────────
function drawHPrev(){
  if(!hSnap)hSnap=ctx.getImageData(0,0,cv.width,cv.height);
  ctx.putImageData(hSnap,0,0);
  ctx.globalAlpha=bop;ctx.strokeStyle=color;ctx.lineWidth=bsz;
  ctx.beginPath();hPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
}
document.addEventListener('dblclick',()=>{
  if(tool==='horizon'&&hPts.length>1){
    ctx.putImageData(hSnap,0,0);
    ctx.globalAlpha=bop;ctx.strokeStyle=color;ctx.lineWidth=bsz;
    ctx.beginPath();hPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
    hPts=[];hSnap=null;saveU();
  }
});

// ── FLOOD FILL ─────────────────────────────
function floodFill(px,py,fc){
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  const d=img.data,w=cv.width,h=cv.height;
  const id=(x,y)=>(y*w+x)*4;
  const ti=id(px,py);
  const tr=d[ti],tg=d[ti+1],tb=d[ti+2],ta=d[ti+3];
  const[fr,fg,fb]=h2r(fc);
  if(tr===fr&&tg===fg&&tb===fb)return;
  const stk=[[px,py]],vis=new Uint8Array(w*h);
  while(stk.length){
    const[x,y]=stk.pop();
    if(x<0||x>=w||y<0||y>=h)continue;
    const i=id(x,y),vi=y*w+x;
    if(vis[vi]||!mCol(d,i,tr,tg,tb,ta))continue;
    vis[vi]=1;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
    stk.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(img,0,0);
}
function mCol(d,i,r,g,b,a,t=30){return Math.abs(d[i]-r)<t&&Math.abs(d[i+1]-g)<t&&Math.abs(d[i+2]-b)<t&&Math.abs(d[i+3]-a)<t;}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// ── EYEDROP ────────────────────────────────
function pickCol(x,y){const p=ctx.getImageData(x,y,1,1).data;setColor('#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));}

// ── QUITA FONDO ────────────────────────────
function removeBgAt(px,py,thresh){
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  const d=img.data,w=cv.width,h=cv.height;
  const id=(x,y)=>(y*w+x)*4;
  const ti=id(px,py);
  const tr=d[ti],tg=d[ti+1],tb=d[ti+2],ta=d[ti+3];
  const stk=[[px,py]],vis=new Uint8Array(w*h);
  while(stk.length){
    const[x,y]=stk.pop();
    if(x<0||x>=w||y<0||y>=h)continue;
    const i=id(x,y),vi=y*w+x;
    if(vis[vi]||!mCol(d,i,tr,tg,tb,ta,thresh))continue;
    vis[vi]=1;d[i+3]=0;
    stk.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(img,0,0);
  transBg=true;
}
function removeBg(){setT('rembg');}

// ── TEXTO ──────────────────────────────────
function openTxtModal(){
  document.getElementById('txtOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('txtArea').focus(),100);
}
function closeTxtModal(){
  document.getElementById('txtOverlay').classList.remove('show');
  pendingText=false;
}
function setTD(d){
  textDir=d;
  ['tdH','tdV','tdD'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(d==='h'?'tdH':d==='v'?'tdV':'tdD').classList.add('on');
}
function previewTxt(){
  // solo enfoca en canvas para que el usuario vea posición
  document.getElementById('txtOverlay').classList.remove('show');
  pendingText=true;
  cv.style.cursor='text';
  document.getElementById('sTool').textContent='Toca donde quieres el texto';
}
function stampTxt(){
  document.getElementById('txtOverlay').classList.remove('show');
  pendingText=true;
  cv.style.cursor='text';
}
function doStampTxt(x,y){
  const txt=document.getElementById('txtArea').value||'Texto';
  const sz=+document.getElementById('tSz').value||36;
  const ff=document.getElementById('tFont').value;
  const useGrad=document.getElementById('tGrad').checked;
  ctx.save();
  ctx.font=`bold ${sz}px "${ff}"`;
  ctx.textBaseline='top';
  ctx.globalAlpha=bop;
  ctx.translate(x,y);
  if(textDir==='v') ctx.rotate(Math.PI/2);
  else if(textDir==='d') ctx.rotate(Math.PI/4);
  if(useGrad){
    const g2=ctx.createLinearGradient(0,0,txt.length*sz*.6,sz);
    g2.addColorStop(0,document.getElementById('g1').value);
    g2.addColorStop(.5,document.getElementById('g2').value);
    g2.addColorStop(1,document.getElementById('g3').value);
    ctx.fillStyle=g2;
  } else ctx.fillStyle=document.getElementById('tCol').value;
  ctx.fillText(txt,0,0);
  ctx.restore();
  cv.style.cursor='crosshair';
  pendingText=false;
}

// ── SUBIR IMAGEN ───────────────────────────
function loadImg(inp){
  const f=inp.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{
    saveU();
    ctx.drawImage(img,0,0,cv.width,cv.height);
    inp.value='';
  };
  img.src=URL.createObjectURL(f);
}

// ── FONDO ──────────────────────────────────
function applyBgColor(){
  transBg=false;
  const c=document.getElementById('bgCol').value;
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  ctx.fillStyle=c;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.putImageData(img,0,0);
  closeModal('mBg');
}
function setBgTransp(){
  transBg=true;
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.putImageData(img,0,0);
  closeModal('mBg');
}

// ── UNDO ───────────────────────────────────
function saveU(){if(undoStk.length>40)undoStk.shift();undoStk.push(ctx.getImageData(0,0,cv.width,cv.height));}
function undo(){if(undoStk.length<2)return;undoStk.pop();ctx.putImageData(undoStk[undoStk.length-1],0,0);}
function clearAll(){saveU();ctx.clearRect(0,0,cv.width,cv.height);if(!transBg){ctx.fillStyle=document.getElementById('bgCol').value||'#fff';ctx.fillRect(0,0,cv.width,cv.height);}}

// ── GUARDAR ────────────────────────────────
function doSave(){
  const fmt=document.getElementById('saveFmt').value;
  const q=+document.getElementById('jpgQ').value/100;
  if(fmt==='pdf'){savePDF();return;}
  if(fmt==='jpg'){
    // jpg: fondo blanco
    const tmp=document.createElement('canvas');
    tmp.width=cv.width;tmp.height=cv.height;
    const tc=tmp.getContext('2d');
    tc.fillStyle='#fff';tc.fillRect(0,0,tmp.width,tmp.height);
    tc.drawImage(cv,0,0);
    dl(tmp.toDataURL('image/jpeg',q),'acas-dibujo.jpg');
  } else {
    dl(cv.toDataURL('image/png'),'acas-dibujo.png');
  }
  closeModal('mSave');
}
function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
function savePDF(){
  // carga jsPDF dinámicamente
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=()=>{
    const {jsPDF}=window.jspdf;
    const orient=cv.width>cv.height?'landscape':'portrait';
    const pdf=new jsPDF({orientation:orient,unit:'px',format:[cv.width,cv.height]});
    const img=cv.toDataURL('image/png');
    pdf.addImage(img,'PNG',0,0,cv.width,cv.height);
    pdf.save('acas-dibujo.pdf');
    closeModal('mSave');
  };
  document.head.appendChild(s);
}

// ── MODALS ─────────────────────────────────
function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function applyPreset(){const v=document.getElementById('pPreset').value;if(!v)return;const[w,h]=v.split(',');document.getElementById('cw').value=w;document.getElementById('ch').value=h;}
function applySize(){initCv(+document.getElementById('cw').value||794,+document.getElementById('ch').value||1123);closeModal('mSize');}

// ── INIT ───────────────────────────────────
updBrush();
setColor('#000000');
</script>
